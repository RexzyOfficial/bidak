name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch engine sources (sf16.1, sf11, nnue)
        run: bash tools/fetch_engine.sh

      - name: Copy NNUE into sf16 source dir for embedding
        run: |
          cp external/nnue/nn-b1a57edbea57.nnue external/sf16/src/
          cp external/nnue/nn-baff1ede1f90.nnue external/sf16/src/
          ls -lh external/sf16/src/*.nnue

      - name: Setup Android NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Build libstockfish.so (arm64-v8a)
        run: |
          cmake -S cpp -B cpp/build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build-arm64 --target stockfish -j
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp cpp/build-arm64/libstockfish.so android/app/src/main/jniLibs/arm64-v8a/

      - name: Build libstockfish.so (armeabi-v7a)
        run: |
          cmake -S cpp -B cpp/build-armv7 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build-armv7 --target stockfish -j
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cp cpp/build-armv7/libstockfish.so android/app/src/main/jniLibs/armeabi-v7a/

      - name: List packaged .so
        run: find android/app/src/main/jniLibs -type f

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Build APK (debug, dual-abi)
        run: flutter build apk --debug --target-platform android-arm,android-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bidak-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
